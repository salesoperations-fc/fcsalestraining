<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acqui Service Practice Check: Lead Enrollment and Reassignment</title>
<style>
:root{--teal:#0b6b5b;--teal-d:#0a3d37;--ink:#0f2a2e;--mut:#6b7c80;--line:#e3ebea;--bg:#eaf7f4;--blue:#2742c9}
*{box-sizing:border-box}
body{zoom:1.15;margin:0;font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:var(--ink);background:linear-gradient(135deg,#f6fbfa 0%,#e4f5f1 60%,#d9f0ea 100%);min-height:100vh}
button{font:inherit;cursor:pointer}
/* sidebar */
:root{--sw:48px}body.sb-open{--sw:200px}
#side{position:fixed;left:0;top:0;bottom:0;width:var(--sw);background:#f6fcfb;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 6px;gap:6px;z-index:20;transition:width .15s}
#side .hd{display:flex;align-items:center;justify-content:center;height:24px;margin-bottom:8px}
body.sb-open #side .hd{justify-content:space-between;padding:0 8px}
#side .hd b{display:none;font-size:10px;letter-spacing:1.4px;color:#8a9a9d}body.sb-open #side .hd b{display:block}
#side .hd button{width:22px;height:22px;border:0;background:none;color:#556;font-size:15px;padding:0}
#side .nv{height:36px;border:0;border-radius:9px;background:none;color:#40565a;display:flex;align-items:center;justify-content:center;gap:14px;position:relative;padding:0}
body.sb-open #side .nv{justify-content:flex-start;padding:0 12px;font-size:12px;font-weight:600}
#side .nv svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#side .nv .l{display:none}body.sb-open #side .nv .l{display:inline}
#side .nv.on{background:#2f7270;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18)}
body:not(.sb-open) #side .nv:hover::after{content:attr(data-tip);position:absolute;left:46px;top:7px;background:#0f2a2e;color:#fff;font-size:10px;padding:2px 7px;border-radius:5px;white-space:nowrap;z-index:30}
/* top bar */
#top{position:sticky;top:0;z-index:15;padding:12px 0 0 calc(var(--sw) + 20px);height:48px;transition:padding .15s}
#sbox{position:relative;width:230px}
#sbox input{width:100%;height:30px;border:1px solid var(--line);border-radius:7px;background:#f3f6f6;padding:0 24px 0 24px;font-size:12px;outline:none}
#sbox input:focus{background:#fff;border-color:var(--teal)}
#sbox .ic{position:absolute;left:8px;top:8px;width:13px;height:13px;stroke:#667;fill:none;stroke-width:1.8}
#sbox .x{position:absolute;right:6px;top:3px;border:0;background:none;font-size:14px;color:#889;display:none}
#sres{position:absolute;top:34px;left:0;width:240px;background:#fff;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.15);display:none;overflow:hidden}
.sr{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;cursor:pointer;gap:6px}
.sr:hover{background:#f0f8f6}.sr b{font-size:11px;font-weight:600;display:block;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sr small{font-size:9px;color:var(--mut)}
.badge{font-size:9px;color:#889;background:#f1f3f3;border-radius:4px;padding:1px 5px}.badge.id{background:#e0f4f0;color:var(--teal);font-weight:600}
/* main */
#main{padding:44px 24px 40px calc(var(--sw) + 20px);max-width:1280px;transition:padding .15s}
h1{font-size:20px;margin:6px 0 2px;letter-spacing:-.3px}.sub{color:var(--mut);font-size:11px;margin-bottom:12px}
.card{background:#fff;border-radius:8px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:12px}
.ctitle{font-size:9.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;font-size:11px;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:#f6faf9}
.btn.dark{background:var(--teal-d);color:#fff;border-color:var(--teal-d);font-weight:600}.btn.teal{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600}
.btn[disabled]{opacity:.55;cursor:not-allowed}
/* home */
.hello{display:flex;justify-content:space-between;align-items:flex-start}
.tabs{display:flex;gap:14px;margin-bottom:6px;font-size:11px}
.tabs span{padding:4px 0;color:#445;cursor:pointer;border-bottom:2px solid transparent}.tabs span.on{color:var(--blue);border-color:var(--blue);font-weight:600}
.empty{text-align:center;color:var(--mut);padding:26px 0;font-size:10.5px}
.grid3{display:grid;grid-template-columns:1.2fr 1fr .8fr;gap:24px}
.bar{height:9px;border-radius:5px;background:#eceeef}
table{width:100%;border-collapse:collapse}
th{font-size:9px;letter-spacing:.5px;text-transform:uppercase;text-align:left;padding:8px 6px;color:#1c3033;font-weight:700;white-space:nowrap}
td{padding:9px 6px;font-size:11px;border-top:1px solid #f0f4f3;vertical-align:middle}
tr.row:hover td{background:#f7fbfa}
.kt th,.kt td{text-align:center}.kt th:first-child,.kt td:first-child{text-align:left}
.kt td:first-child{font-weight:600}.hl{background:#eaf1ff}.neg{color:#c62b3e}.blue{color:var(--blue);font-weight:600}
.idtag{display:block;font-size:8.5px;background:#e0f4f0;color:var(--teal);width:fit-content;padding:0 4px;border-radius:3px;margin-top:2px}
.link{color:var(--teal);cursor:pointer;font-weight:600}
.sort{color:#9ab}
/* filters */
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:6px}
.fl label{display:block;font-size:9.5px;color:#445;margin-bottom:3px}
.fl input.txt,.sel{height:26px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 8px;font-size:10.5px;min-width:120px;outline:none;color:#445}
.dd{position:relative}
.dd>button{width:100%;min-width:120px;height:26px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:0 8px;font-size:10.5px;color:#556;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left}
.dd.open>button{border-color:var(--teal)}
.dd>button::after{content:"⌄";font-size:11px;margin-top:-3px}
.panel{display:none;position:absolute;top:30px;left:0;min-width:100%;width:max-content;max-width:210px;background:#fff;border-radius:7px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:6px 4px;z-index:12;max-height:260px;overflow:auto}
.dd.open .panel{display:block}
.panel .ph{font-size:9px;color:var(--mut);display:flex;justify-content:space-between;padding:2px 8px 5px}.panel .ph a{color:var(--teal);cursor:pointer;font-weight:600}
.opt{display:flex;gap:7px;align-items:center;padding:5px 8px;font-size:10.5px;cursor:pointer;border-radius:5px}.opt:hover{background:#f1f8f6}
.opt input{accent-color:var(--teal);margin:0}
.opt.pick.on{color:var(--teal);font-weight:600}
.rng input{width:calc(100% - 12px);margin:3px 6px;height:28px;border:1px solid var(--line);border-radius:6px;padding:0 8px;font-size:11px}
.note{font-size:9px;color:var(--mut);margin:0 0 6px}
.pager{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#445;margin-top:8px}
.pager button{border:0;background:none;color:#445;font-size:12px;padding:0 5px}.pager button[disabled]{color:#bbb}
.chip{font-size:9.5px;padding:2px 7px;border-radius:5px;background:#eef2f2}
.chip.blue{background:#e5ecff;color:#2342c0;font-weight:600}.chip.green{background:#dff5e7;color:#1c7a40;font-weight:600}
/* lead page */
.crumb{font-size:9px;color:var(--mut);margin-top:8px}
.lh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.lh h1{margin:2px 0 4px;font-size:17px}.lmeta{display:flex;gap:6px;align-items:center;font-size:9.5px;color:#445;flex-wrap:wrap}
.lmeta .p{background:#eef2f2;border-radius:4px;padding:1px 6px}
.stat{display:flex;gap:26px;flex-wrap:wrap}.stat .bx{border:1px solid #eef2f2;border-radius:6px;padding:6px 10px;min-width:104px}
.stat small{display:block;font-size:8px;letter-spacing:.4px;color:var(--mut);text-transform:uppercase}
.mini{display:flex;gap:22px;margin-top:10px;font-size:9px;color:var(--mut)}.mini b{display:block;color:var(--ink);font-size:11px}
.banner{background:#f1f3f3;border-radius:8px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.banner b{font-size:11px}.banner p{margin:3px 0 0;color:#556;font-size:10.5px}
.ltabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:8px 0 12px;font-size:11px}.ltabs span{padding:6px 0;cursor:pointer;color:#445}.ltabs span.on{border-bottom:2px solid var(--ink);font-weight:600;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 8px;font-size:10.5px}.kv span:nth-child(odd){color:var(--mut)}
.task{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:2px 0}
.task .t{font-size:10.5px}.task small{display:block;color:var(--mut);font-size:9px;margin-top:1px}
.pill{font-size:8px;font-weight:700;background:#eef2f2;border-radius:3px;padding:1px 4px;margin-right:4px}.pill.b{background:#e5ecff;color:#2342c0}
/* modal */
#ov{position:fixed;inset:0;overflow:hidden;background:rgba(10,30,30,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
#md{background:#fff;border-radius:10px;width:340px;max-width:92vw;max-height:calc(88vh / 1.15);overflow-y:auto;padding:0 16px 14px;overscroll-behavior:contain}
#md.wide{width:520px}
#md h3{margin:0 0 10px;font-size:13px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;padding:14px 0 8px;z-index:2}#md h3 button{border:0;background:none;font-size:20px;line-height:1;color:#556;padding:0 4px}
#md .info{background:#f3f6f6;border-radius:6px;padding:7px 9px;font-size:10px;color:#445;margin-bottom:10px}
#md label{display:block;font-size:10px;font-weight:600;margin:8px 0 3px}#md label i{color:#c62b3e;font-style:normal}
#md select,#md input[type=text],#md textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:inherit;font-size:11px;background:#fff;outline:none}
#md select:focus,#md input:focus,#md textarea:focus{border-color:var(--teal)}
#md textarea{min-height:56px;resize:vertical}
#md .foot{display:flex;justify-content:flex-end;margin-top:12px;gap:8px;position:sticky;bottom:0;background:#fff;padding:8px 0 0}
.sug{border:1px solid var(--line);border-radius:6px;max-height:130px;overflow:auto;margin-top:3px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.1)}
.sug div{padding:6px 8px;cursor:pointer;font-size:10.5px}.sug div:hover{background:#f1f8f6}.sug small{display:block;color:var(--mut);font-size:9px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f2a2e;color:#fff;padding:8px 14px;border-radius:7px;font-size:11px;display:none;z-index:60}
#tag{position:fixed;right:10px;bottom:8px;font-size:9px;color:#78908c;z-index:5}

/* lead header + status cards */
.lh h1 .rf{display:inline-block;margin-left:8px;color:#9aa;font-size:15px;vertical-align:middle}
.lmeta .p{background:#f1f4f4;border:1px solid #e3ebea;border-radius:5px;padding:2px 8px}
.lmeta .lst{cursor:pointer;color:#2a4a47;display:inline-flex;gap:5px;align-items:center}.lmeta .lst:hover{background:#e6f1ef}
.lmeta .dot{color:#9aa}.lmeta .syn{color:#9aa}
.idot{display:inline-grid;place-items:center;width:12px;height:12px;border-radius:50%;background:#1c6a66;color:#fff;font-size:8px;font-weight:700;cursor:pointer;vertical-align:middle}
.stats2{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.scard{position:relative;border:1px solid #e3ebea;border-radius:12px;padding:10px 14px;min-width:210px;background:#fff}
.sch{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:700;letter-spacing:.6px;color:#8a9a9d;margin-bottom:8px;gap:20px}
.ics{display:flex;gap:8px}.ic{cursor:pointer;display:inline-grid;place-items:center}.ic svg{width:15px;height:15px;stroke:#667;fill:none;stroke-width:1.7}.ic.clk svg{stroke:#2a8a82}
.sp2{display:inline-block;font-size:11.5px;font-weight:700;background:#f1f3f3;color:#667;border-radius:6px;padding:4px 9px}
.sp2.g{background:#e7f6ea;color:#2a7d43}.sp2.b{background:#e8eefc;color:#2342c0}.sp2.a{background:#fff3dc;color:#9a6200}.sp2.r{background:#fde8ea;color:#b3243a}
.pop{display:none;position:absolute;left:0;top:calc(100% + 6px);background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:10px 4px;z-index:25;min-width:230px}
.pop.open{display:block}.pop h6{margin:0 0 6px;padding:0 12px;font-size:10px;letter-spacing:.6px;color:#8a9a9d}
.pop .po{display:flex;gap:10px;align-items:center;padding:8px 12px;font-size:12px;cursor:pointer;border-radius:6px}.pop .po:hover{background:#f1f8f6}.pop .po i{width:8px;height:8px;border-radius:50%;background:#2e55e6;flex:none}
.pop.am{left:auto;top:auto;position:absolute;min-width:260px;padding:12px 14px}.pop.am .kv{grid-template-columns:90px 1fr}
.mini2{display:flex;gap:30px;margin-top:12px;flex-wrap:wrap}.mini2 span{font-size:11px;color:#8a9a9d}.mini2 b{display:block;color:var(--ink);font-size:15px;margin-top:2px}
table.ht{width:100%}.ht th{text-transform:none;letter-spacing:0;font-weight:500;color:#889;font-size:11px;padding:8px 6px}.ht td{font-size:12px;padding:9px 6px}
/* lead status side panel */
#sp{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:92vw;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.15);z-index:40;transform:translateX(105%);transition:transform .2s;padding:18px 20px;overflow:auto}
#sp.open{transform:none}
#sp .t{font-size:10px;letter-spacing:1px;color:#889;font-weight:700}#sp .n{font-size:14px;font-weight:700;margin:2px 0 14px}
#sp .x{position:absolute;right:16px;top:14px;border:0;background:none;font-size:20px;color:#667;cursor:pointer}
#sp .row2{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid #f0f4f3;font-size:11.5px}
#sp .row2 span.c{background:#eef2f2;border-radius:6px;padding:3px 9px;font-weight:600}#sp .row2 em{font-style:normal;color:#667}

.bvp{font-size:9.5px;color:#8a9a9d;margin-top:8px;line-height:1.5}.bvp a{color:var(--teal);cursor:pointer;font-weight:600}

#exitbub{position:fixed;top:10px;right:14px;z-index:1200;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:999px;box-shadow:0 4px 18px rgba(0,0,0,.18);padding:6px 6px 6px 14px;font-size:12px;font-weight:600;color:#2a4a47}
#exitbub .live{width:8px;height:8px;border-radius:50%;background:#2bb673;box-shadow:0 0 0 3px rgba(43,182,115,.25)}
#exitbub button{border:0;background:#8a0f2f;color:#fff;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700}
#exitdlg{position:fixed;inset:0;background:rgba(10,25,28,.6);z-index:1300;display:none;align-items:center;justify-content:center}
#exitdlg .box{background:#fff;border-radius:14px;padding:22px 24px;width:380px;max-width:92vw;box-shadow:0 14px 50px rgba(0,0,0,.4)}
#exitdlg h3{margin:0 0 8px;font-size:17px}#exitdlg p{margin:0 0 16px;font-size:14px;line-height:1.5;color:#456}
#exitdlg .r{display:flex;justify-content:flex-end;gap:8px}#exitdlg .btn{font-size:14px;padding:8px 16px}

/* the exit bubble steps aside when the right-hand panel is open, so it never covers the panel's X */
body.sp-on #exitbub,body:has(#sp.open) #exitbub{right:calc(340px + 30px)}

/* the "approve as Team Lead" sandbox helper is not part of the lecture or the exams */
body[data-mode="exam"] #simappr,body[data-mode="tour"] #simappr{display:none}

/* browser tabs: Acqui Service, SEC website, DTI website */
body{padding-top:28px}
#bm{position:fixed;top:0;left:0;right:0;height:28px;background:#dee1e6;display:flex;align-items:flex-end;gap:2px;padding:0 10px;z-index:52;font-size:11px;white-space:nowrap}
#bm .tb{padding:6px 18px;border-radius:8px 8px 0 0;cursor:pointer;color:#444;background:#cdd1d8;font-weight:600}
#bm .tb:hover{background:#e9ebef}#bm .tb.on{background:#fff;color:#0f2a2e}
#side{top:28px}#top{top:28px}#sp{top:28px}
#exitbub{top:34px}
/* the SEC / DTI websites fill the page under the tabs */
#brw{display:none;position:fixed;top:28px;left:0;right:0;bottom:0;z-index:55;background:#fff;overflow:auto}
#brw .pane{min-height:100%}#brw .mockb{background:#fff3dc;color:#7a4a00;font-size:11px;text-align:center;padding:4px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #cdd;border-top-color:#3c7;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}.spin.big{width:44px;height:44px;border-width:5px}@keyframes sp{to{transform:rotate(360deg)}}
.secw{font-family:Arial,Helvetica,sans-serif;color:#222}.sechead{padding:12px 24px;display:flex;justify-content:space-between;align-items:center;font-size:14px}.sechead span{font-size:12px;color:#444}.sechead u{color:#3a8a2a;text-decoration-thickness:2px}
.secband{background:#4a8a2e;color:#fff;font-size:24px;padding:34px 40px}
.secbox{margin:30px auto;max-width:620px;background:#f3f3f3;border-radius:6px;padding:12px 14px}.secbox label{font-size:12px;display:block;margin-bottom:4px}
.secrow{display:flex}.secrow input{flex:1;height:30px;border:1px solid #bbb;padding:0 8px;font-size:13px;outline:none}.secrow button{border:0;background:#4a86c5;color:#fff;padding:0 18px;font-size:12px;cursor:pointer}
.capok{margin:10px auto 0;width:230px;background:#fff;border:1px solid #ddd;padding:8px 12px;font-size:12px;border-radius:3px}.tick{color:#2ea043}
.sect{margin:0 auto 30px;width:calc(100% - 80px);max-width:760px;border-collapse:collapse;font-size:12.5px}.sect th,.sect td{border:1px solid #ddd;padding:6px 8px;text-align:left}.sect th{background:#fafafa}.sect a{color:#2b6cb0;cursor:pointer}.sect a:hover{text-decoration:underline}
.dtiw{display:flex;min-height:100%;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#222}.dtiside{width:150px;background:#1f2a30;color:#cfd8dc;flex:none}
.dtilogo{background:#fff;color:#1c3f8c;font-weight:900;font-size:20px;text-align:center;padding:14px 0}.dtilogo small{font-size:8px;color:#888;font-weight:400}.dnav{font-size:9px;padding:10px 12px;color:#789}.dit{padding:9px 12px;font-size:11px}
.dtimain{flex:1;background:#eef0f3}.dtitop{background:#2f80b3;color:#fff;padding:8px 14px}.dtimain h3{margin:14px 16px 8px;font-weight:400;font-size:16px}
.dtipanel{margin:0 16px 20px;background:#fff;border:1px solid #2f80b3}.dtiph{background:#2f80b3;color:#fff;padding:7px 10px;font-size:13px}.dtipb{padding:12px 24px}
.dtipb label{display:block;font-weight:700;margin:10px 0 3px;font-size:11px}.dtipb input[type=text],.dtipb input:not([type]),.dtipb select{height:26px;border:1px solid #bbb;padding:0 6px;font-size:12px}
.dtirow{display:flex;gap:0}.dtirow select{width:160px}.dtirow input{width:330px}
#dsug{position:absolute;top:50px;left:0;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:5;width:240px}.dsi{padding:7px 12px;font-size:12px;cursor:pointer}.dsi:hover{background:#eef4ff}
.dtirow2{display:flex;gap:18px;align-items:flex-start;margin-top:12px}.dcap{background:#f1f1f1;border:1px solid #ddd;padding:8px;width:220px}

  $("#ttabs",root).innerHTML=tabs.map(function(t){var n=tabItems(t).length+(reqIn(t)?reqItems().length:0);return '<span data-t="'+t+'" class="'+(t===TTAB?"on":"")+'">'+t+' <span class="chip '+(t===TTAB?"blue":"")+'">'+n+'</span></span>'}).join("");

function drawCov(root){
  var by=S.by||"Monthly",c=$("#cov",root);
  if(by==="All"){c.innerHTML="";return}
  var yrs='<select class="sel" data-sel="yr" style="min-width:70px">'+[2025,2026].map(function(y){return '<option'+(y==(S.yr||2026)?" selected":"")+'>'+y+'</option>'}).join("")+'</select>';

   '<select class="sel" data-sel="qt">'+[1,2,3,4].map(function(q){return '<option value="'+q+'"'+(q==(S.qt||4)?" selected":"")+'>Q'+q+'</option>'}).join("")+'</select>';

function inCov(ym){
  var by=S.by||"Monthly";if(by==="All")return true;
  var y=+ym.slice(0,4),m=+ym.slice(5)-1;
  if(y!==+(S.yr||2026))return false;

  return Math.floor(m/3)+1===+(S.qt||4);
}

  root.querySelectorAll("[data-sel]").forEach(function(s){s.onchange=function(){S[s.dataset.sel]=s.value;setTimeout(function(){ACQUI.emit("filter",{key:"cov",by:S.by||"Monthly",mo:S.mo==null?9:+S.mo,qt:+(S.qt||4),yr:+(S.yr||2026)})},0);if(s.dataset.sel==="by")drawCov(root);bindCov(root,redraw);redraw()}});

var BA_OPTS=["Information Resubmitted"];
var FVS=["Fully Verified with Future Revenue","Fully Verified with Provisional Limit"];
/* BCL flow: ARFR (once) -> Information Missing <-> Information Resubmitted -> Fully Verified; Fully Verified -> Information Resubmitted -> Fully Verified.
   The AM sets ARFR and Information Resubmitted; BVP sets Information Missing and Fully Verified. */
function bclOpts(l){
  var st=bclOf(l),hadARFR=bclHist(l).some(function(h){return h.s==="Account Ready for Review"});
  if(!st)return hadARFR?[]:["Account Ready for Review"];
  if(st==="Information Missing"||/^Fully Verified/.test(st))return ["Information Resubmitted"];
  return [];
}
function bvpOpts(l){var st=bclOf(l);return(st==="Account Ready for Review"||st==="Information Resubmitted")?["Information Missing"].concat(FVS):[]}
function pillCls(st){return /Fully Verified|Approved|Utilized/.test(st)?"g":/Clarification/.test(st)?"a":/Missing|Rejected|Blacklisted|Off-boarded/.test(st)?"r":"b"}
function bclOf(l){return l.risk&&l.risk!=="-"?l.risk:null}
function bclHist(l){return l.bclH||(bclOf(l)?[{s:bclOf(l),at:"Oct 20, 2026, 10:12 AM",by:"BVP"}]:[])}
function baHist(l){return l.baH||(l.ba?[{s:l.ba,at:"Oct 20, 2026, 10:15 AM",by:"BVP"}]:[])}
function iso(d){var p=function(n){return n<10?"0"+n:n};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function leadHist(l){
  if(l.leadH)return l.leadH;
  var i=Math.max(0,LEAD_STATUS.indexOf(l.status)),out=[],d=new Date(l.eng+"T00:00:00");
  for(var k=i;k>=0;k--){out.push({s:LEAD_STATUS[k],d:fdate(iso(d))});d=new Date(d.getTime()-(k>2?3:20)*864e5)}
  return out;
}

<script>
/* Practice check: lead reassignment and enrollment of new leads. Loaded before exam.js, which runs these tasks instead of the navigation check.
   The story of each question is a chat on the right (the owner, or Mia Santos, the referrer who refers a lot). Nothing says what to click.
   1 self-generated, lead exists but is Onboarded -> must NOT be requested   2 self-generated, lead exists -> request it
   3 self-generated, new lead, SEC certificate in the camera roll            4 referral, new lead, only the business name (DTI sole prop): search it yourself
   5 referral, lead already exists (nobody says so): search first, then request. Creating it anyway = error and half the points.
   Each question is graded per field (channel, referrer, registration number...). Weights add up to 1. Notes on a request give a small bonus. */
(function(){
  if (window.ACQUI_ONE_REFERRER) ACQUI_ONE_REFERRER();   /* one referrer (Mia Santos) enrolled, no leads yet */
  function L(id){ return LEADS.filter(function(l){ return l.id === id; })[0]; }
  function norm(s){ return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
  function unrequest(d){ if (d && d.req && d.id && typeof pending !== "undefined") { delete pending[d.id]; } render(); }
  function removeLead(d){ if (d && d.ch && d.id) { for (var i = 0; i < LEADS.length; i++) { if (LEADS[i].id === d.id) { LEADS.splice(i, 1); break; } } } render(); }
  function removeByName(name){ for (var i = LEADS.length - 1; i >= 0; i--) { if (LEADS[i].owner === "me" && norm(LEADS[i].name) === norm(name)) LEADS.splice(i, 1); } }
  function clearPending(id){ if (typeof pending !== "undefined") delete pending[id]; }
  /* trying to Create Lead for a lead that already exists is blocked in the app: a deduction (question 5 halves the points instead) */
  function dupMsg(ev){ return ev === "lead-create-blocked" ? { msg: "That lead already exists. You can't create it again. Request the lead instead.", cost: 0.5 } : null; }
  var notesOk = function(q){ return String(q.notes || "").trim().length >= 10; };
  var isFake = function(reg){ return !REGISTRY.some(function(r){ return norm(r.no) === norm(reg); }); };

  /* request this lead: weights for the fields, notes = bonus */
  function request(id, name, referral){
    return function(ev, d, c){
      if (ev === "lead-create-blocked") { if (referral) return false; return dupMsg(ev); }
      if (ev === "lead-created" && referral) { c.flags.dup = true; return false; }   /* it goes through, but the lead already existed: half points at the end */
      if (ev !== "request-sent") return false;
      var q = d.req;
      if (d.id !== id) return "That request is for a different lead. The lead you need is " + name + ".";
      var items = referral ? [
        { label: "Approver chosen", w: 0.1, ok: !!q.approver },
        { label: "Channel (Last Touch): Referrals", w: 0.3, ok: q.channel === "Referrals" },
        { label: "Referral Channel: Drip", w: 0.2, ok: q.rc === "Drip" },
        { label: "Referrer: Mia Santos", w: 0.2, ok: !!q.ref && q.ref.k === "Mia Santos" },
        { label: "FC Referrer: you", w: 0.2, ok: !!q.fc && /^1368/.test(q.fc.k) }
      ] : [
        { label: "Approver chosen", w: 0.2, ok: !!q.approver },
        { label: "Channel (Last Touch): KAM - Self Generated Leads", w: 0.8, ok: q.channel === "KAM - Self Generated Leads" }

    state = "idle"; dim.style.display = "block"; box.className = "full"; document.body.classList.remove("xp-on");
    box.innerHTML = '<div class="k">Practice check · not graded</div><h2>' + esc(CFG.title || "Find your way around Acqui Service") + '</h2>' +
      '<p style="font-size:15px;line-height:1.55;margin:8px 0 10px">' + (CFG.intro || ('You will get ' + TASKS.length + ' short situations, one at a time. Use the simulation behind this box to find the answer or the right place. Some questions ask you to type or pick what you find.')) + '</p>' +
      '<p style="font-size:14px;line-height:1.55;margin:0 0 14px;color:#456">' + (CFG.scoring || ('Every question starts with 1 point. A hint costs ' + HINT_COST + ' point, and each wrong answer costs ' + WRONG_COST + '.')) + ' This is practice, so your score is not recorded as a grade. Aim for ' + PASS + '% or more.</p>' +
      (CFG.askName ? '<div style="background:#f4f8f8;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 14px"><div style="font-size:13px;line-height:1.5;color:#345;margin-bottom:8px"><b>Honor code.</b> I will answer this test on my own. I will not ask anyone for help, and I will not share the questions or answers.</div><label style="font-size:13px;font-weight:700">AM name: <input type="text" id="exname" placeholder="Type your name" autocomplete="off" style="margin-top:4px"></label><div style="font-size:11px;color:var(--mut);margin-top:4px">This is the name you will use in the Acqui Service simulation.</div></div>' : '') +
      '<div class="row"><span>' + (window.ACQUI_STANDALONE ? '' : '<a href="../dashboard.html" style="font-size:13px;color:var(--teal)">Back to Day 5</a> · <a href="' + NEXT_HREF + '" style="font-size:13px;color:var(--teal)">' + NEXT_LABEL + ' first</a>') + '</span><button class="btn dark" id="exgo">Start</button></div>';
    document.getElementById("exgo").onclick = function(){
      if (CFG.askName) {
        var nm = document.getElementById("exname").value.trim();
        if (nm.length < 2) { document.getElementById("exname").style.borderColor = "#b3243a"; document.getElementById("exname").focus(); return; }
        AM_NAME = nm; ME = nm; FC_STAFF[0] = "1368 - " + nm; ORIG.concat(BCLS).forEach(function(o){ o.am = nm; }); render();
      }
      begin();
    };
  }
  function begin(){ n = 0; res = []; started = Date.now(); TASKS.forEach(function(t){ if (t.reset) t.reset(); }); location.hash = "#/home"; dim.style.display = "none"; show(); }

  function show(){
    flags = {}; hintUsed = false; wrongs = 0; loss = 0; picked = null; state = "asking"; box.className = "";
    var t = TASKS[n];
    if (t.setup) t.setup();
    drawPanel(t.chat);
    var answerUi = "";
    if (t.type === "input") answerUi = '<input type="text" id="exin" placeholder="' + esc(t.placeholder || "Type your answer") + '" autocomplete="off"><div id="exmsg"></div>';
    if (t.type === "mcq") answerUi = '<div id="exch">' + shuffle(t.choices).map(function(c){ return '<div class="opt2" data-c="' + esc(c) + '"><span>○</span> ' + esc(c) + '</div>'; }).join("") + '</div><div id="exmsg"></div>';
    if (t.type === "nav" || t.type === "act") answerUi = '<div id="exmsg"></div>';
    box.innerHTML = '<div class="bar"><i style="width:' + (n / TASKS.length * 100) + '%"></i></div><div class="k">Question ' + (n + 1) + ' of ' + TASKS.length + '</div>' +
      '<div class="qt">' + (t.html ? t.text : esc(t.text)) + '</div>' + answerUi + '<div id="exh"></div>' +
      '<div class="row"><span style="display:flex;gap:8px">' + (t.noHint ? '' : '<button class="btn" id="exhint">Show hint (-' + HINT_COST + ')</button>') + ((t.type === "input" || t.type === "mcq") ? '<button class="btn dark" id="exsub">Submit</button>' : '') + (t.alt ? '<button class="btn dark" id="exalt">' + esc(t.alt.label) + '</button>' : '') + '</span><button class="btn" id="exskip">Skip (0 points)</button></div>';
    if (t.alt) document.getElementById("exalt").onclick = function(){ handle(t, t.alt.check({ flags: flags })); };
    if (!t.noHint) document.getElementById("exhint").onclick = function(){
      if (!hintUsed) hintUsed = true;
      document.getElementById("exh").innerHTML = '<div class="hint">Hint: ' + esc(t.hint) + '</div>';
      this.textContent = "Hint used (-" + HINT_COST + ")";
    };
    document.getElementById("exskip").onclick = function(){
      /* mini confirm bubble: skipping is 0 points, so give them a way back */
      if (document.getElementById("exconf")) return;
      var c = document.createElement("div"); c.id = "exconf";
      c.style.cssText = "position:absolute;right:22px;bottom:68px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.25);padding:10px 14px;font-size:13px;z-index:2";
      c.innerHTML = '<div style="margin-bottom:8px"><b>Skip this question?</b><br>You will get 0 points for it.</div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="exback">Go back</button><button class="btn dark" id="exsure">Yes, skip</button></div>';
      box.style.position = "fixed"; box.appendChild(c);
      document.getElementById("exback").onclick = function(){ c.remove(); };
      document.getElementById("exsure").onclick = function(){ finishQ(0, "skipped"); };
    };
    if (t.type === "input") {
      var inp = document.getElementById("exin");
      document.getElementById("exsub").onclick = submit;
      inp.onkeydown = function(e){ if (e.key === "Enter") submit(); };
    }
    if (t.type === "mcq") {
      document.querySelectorAll("#exch .opt2").forEach(function(o){ o.onclick = function(){
        picked = o.dataset.c;
        document.querySelectorAll("#exch .opt2").forEach(function(x){ x.classList.remove("sel"); x.firstChild.textContent = "○"; });
        o.classList.add("sel"); o.firstChild.textContent = "●";
      }; });
      document.getElementById("exsub").onclick = submit;
    }
  }
  function norm(x){ return String(x).toLowerCase().replace(/[\s,\u20b1]/g, "").replace(/\.0+$/, ""); }
  function submit(){
    var t = TASKS[n], val = t.type === "input" ? document.getElementById("exin").value : picked;
    var msg = document.getElementById("exmsg");
    if (!val) { msg.innerHTML = '<div class="msg bad">Please give an answer first.</div>'; return; }
    var ok = t.answer().some(function(a){ return norm(a) === norm(val); });
    if (ok) { finishQ(pointsNow(), hintUsed ? "hint" : "ok"); }
    else { wrongs++; msg.innerHTML = '<div class="msg bad">Not quite. Check the simulation and try again. (-' + WRONG_COST + ')</div>'; }
  }

  /* a question is finished: show the green "Done!" strip and wait for the learner to continue */
  function finishQ(pts, how, why, detail){
    if (state !== "asking") return;
    state = "done";
    res.push({ text: TASKS[n].text.replace(/<[^>]+>/g, " "), pts: pts, how: how, hint: hintUsed, wrongs: wrongs, why: why || "", detail: detail || "" });
    var last = n === TASKS.length - 1;
    var note = how === "skipped" ? "Skipped" : how === "wrong" ? why : how === "graded" ? fmtPts(pts) + " / 1 point" + (hintUsed || wrongs ? " (" + [hintUsed ? "hint -" + HINT_COST : "", wrongs ? wrongs + " wrong -" + fmtPts(loss) : ""].filter(Boolean).join(", ") + ")" : "") : fmtPts(pts) + (pts === 1 ? " point" : " points") + (hintUsed || wrongs ? " (" + [hintUsed ? "hint -" + HINT_COST : "", wrongs ? wrongs + " wrong -" + fmtPts(loss) : ""].filter(Boolean).join(", ") + ")" : "");
    box.innerHTML = '<div class="bar"><i style="width:' + ((n + 1) / TASKS.length * 100) + '%"></i></div><div class="k">Question ' + (n + 1) + ' of ' + TASKS.length + '</div>' +
      '<div class="qt" style="font-size:15px;color:#456">' + (TASKS[n].html ? TASKS[n].text : esc(TASKS[n].text)) + '</div>' +
      '<div class="done"' + (how === "wrong" ? ' style="background:#fde8ea;border-color:#e5a3ad"' : '') + '><div><b' + (how === "wrong" ? ' style="color:#b3243a"' : '') + '>' + (how === "skipped" ? "Skipped" : how === "wrong" ? "✗ Not correct" : how === "graded" ? (pts >= 0.8 ? "✓ Done!" : pts >= 0.5 ? "Done. Some parts were missed" : "Done. Most parts were missed") : "✓ Done!") + '</b><small>' + note + '</small>' + (detail || "") + '</div><button class="btn dark" id="exnext">' + (last ? "See my result" : "Next question →") + '</button></div>';
    document.getElementById("exnext").onclick = function(){ n++; if (n >= TASKS.length) finish(); else show(); };
  }

  function finish(){
    state = "idle";
    var total = res.reduce(function(a, r){ return a + r.pts; }, 0), pct = Math.round(total / TASKS.length * 100), pass = pct >= PASS;
    var secs = Math.round((Date.now() - started) / 1000);
    box.className = "full"; dim.style.display = "block";
    box.innerHTML = '<div class="k">Practice check · result' + (AM_NAME ? ' · ' + esc(AM_NAME) : '') + '</div><div class="big ' + (pass ? "ok" : "no") + '">' + pct + '%</div><div style="font-size:16px;font-weight:600">' + (pass ? "Passed" : "Not yet. Review the tour and try again.") + ' (' + fmtPts(total) + ' / ' + TASKS.length + ' points, ' + Math.floor(secs / 60) + 'm ' + (secs % 60) + 's)</div>' +
      '<table>' + res.map(function(r){
        var why = r.how === "skipped" ? "skipped" : r.how === "wrong" ? "wrong" : r.how === "graded" ? (r.pts < 1 ? "partly right" : "") : [r.hint ? "hint" : "", r.wrongs ? r.wrongs + " wrong" : ""].filter(Boolean).join(", ");
        var bad = r.how === "skipped" || r.how === "wrong" || (r.how === "graded" && r.pts < 0.5);
        return '<tr><td style="width:24px" class="' + (bad ? "no" : "ok") + '">' + (bad ? "✗" : "✓") + '</td><td>' + esc(r.text) + (r.detail ? r.detail : "") + '</td><td style="white-space:nowrap;color:var(--mut)">' + why + '</td><td style="text-align:right"><b>' + fmtPts(r.pts) + '</b></td></tr>'; }).join("") + '</table>' +
      '<div class="row"><span>' + (window.ACQUI_STANDALONE ? '' : '<a href="../dashboard.html" style="font-size:13px;color:var(--teal)">Back to Day 5</a> · <a href="' + NEXT_HREF + '" style="font-size:13px;color:var(--teal)">' + NEXT_LABEL + '</a>') + '</span><button class="btn dark" id="exagain">Try again</button></div>';
    document.getElementById("exagain").onclick = intro;
    try { if (window.LMS && LMS.user && LMS.user() && !(LMS.preview && LMS.preview())) LMS.complete(TASK_ID); } catch (err) {}   /* practice: ticks the Day 5 task, no grade saved */
    /* If this ever becomes graded: LMS.saveResult({ id:"d5-nav-check", label:"Acqui navigation check", score:total, max:TASKS.length, pct:pct, kind:"lms", passing:PASS }) */
    window.ACQUI_EXAM_RESULT = { name: AM_NAME, score: total, max: TASKS.length, pct: pct, passed: pass, seconds: secs, tasks: res };
  }

  /* a graded answer: r.items = [{label, w, ok}] (the weights add up to 1), r.bonus = same, r.extra = [{label, loss}], r.factor = multiplier (e.g. 0.5) */
  function gradeIt(t, r){
    var sum = function(a, f){ return (a || []).reduce(function(x, i){ return x + f(i); }, 0); };
    var raw = Math.min(1, sum(r.items, function(i){ return i.ok ? i.w : 0; }) + sum(r.bonus, function(i){ return i.ok ? i.w : 0; })) - sum(r.extra, function(i){ return i.loss; });
    raw = Math.max(0, raw) * (r.factor || 1);
    var line = function(label, ok, val){ return '<div class="' + (ok ? "y" : "n") + '"><span>' + (ok ? "✓ " : "✗ ") + esc(label) + '</span><span>' + val + '</span></div>'; };
    var d = '<div class="bd">' +
      r.items.map(function(i){ return line(i.label, i.ok, i.ok ? "+" + fmtPts(i.w) : "0"); }).join("") +
      (r.bonus || []).map(function(i){ return line(i.label, i.ok, i.ok ? "bonus +" + fmtPts(i.w) : "no bonus"); }).join("") +
      (r.extra || []).map(function(i){ return i.loss ? line(i.label, false, "-" + fmtPts(i.loss)) : ""; }).join("") +
      (r.factor && r.factor < 1 ? '<div class="n"><span>✗ ' + esc(r.factorLabel || "Score reduced") + '</span><span>x ' + r.factor + '</span></div>' : "") + '</div>';
    finishQ(pointsNow(raw), "graded", "", d);
  }

  /* result of a check: true = done. "text" = wrong, try again (-0.25). { fatal: "text" } = wrong for good (0 points). false = nothing yet. */
  function handle(t, r){
    if (state !== "asking") return;
    if (r === true) { finishQ(pointsNow(), hintUsed ? "hint" : "ok"); return; }
    if (r && r.items) { gradeIt(t, r); return; }
    if (r && r.fatal) { if (t.undo) t.undo(); finishQ(0, "wrong", r.fatal); return; }
    if (typeof r === "string" || (r && r.msg)) {
      var text = typeof r === "string" ? r : r.msg, cost = typeof r === "string" ? WRONG_COST : (r.cost || WRONG_COST);
      wrongs++; loss += cost;
      var m = document.getElementById("exmsg"); if (m) m.innerHTML = '<div class="msg bad">' + esc(text) + ' (-' + cost + ')</div>';
      if (t.undo) t.undo();
    }
  }
  ["render", "search-pick", "status-history", "lead-status-history", "orig-detail", "bcl-detail", "filter", "status-set", "referrer-open", "request-sent", "lead-created", "lead-create-blocked", "bookmark-open", "sec-search", "dti-search"].forEach(function(ev){
    ACQUI.on(ev, function(d){
      if (state !== "asking") return;
      var t = TASKS[n]; if (!t || (t.type !== "nav" && t.type !== "act")) return;
      if (ev === "render" && d && d.route === "lead") { flags.visited = flags.visited || {}; flags.visited[d.id] = true; }
      if (ev === "lead-create-blocked") flags.dup = true;
      var c = { flags: flags };
      /* check on the next tick so the page has finished drawing */
      setTimeout(function(){ if (state === "asking" && TASKS[n] === t) { c.d = d; t.d = d; var r = (t.grade || t.check)(ev, d, c); if (r) { t._ev = d; handle(t, r); } } }, 30);
    });
  });
  /* "Finish test" (next to Exit): everything not answered yet is 0 points */
  ACQUI.on("finish-test", function(){
    if (state === "idle") return;
    if (state === "asking") res.push({ text: TASKS[n].text.replace(/<[^>]+>/g, " "), pts: 0, how: "skipped", hint: false, wrongs: 0, why: "", detail: "" });
    for (var i = res.length; i < TASKS.length; i++) res.push({ text: TASKS[i].text.replace(/<[^>]+>/g, " "), pts: 0, how: "skipped", hint: false, wrongs: 0, why: "", detail: "" });
    state = "idle"; finish();
  });
  intro();
})();
</script>
</body>
