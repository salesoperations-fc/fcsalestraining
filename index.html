<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | AM Onboarding Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2a10 10 0 0 1 10 10h-7a3 3 0 0 0-3-3z' fill='%23F0605D'/><path d='M22 12a10 10 0 0 1-10 10v-7a3 3 0 0 0 3-3z' fill='%232BB3A8'/><path d='M12 22A10 10 0 0 1 2 12h7a3 3 0 0 0 3 3z' fill='%23F5B83D'/><path d='M2 12A10 10 0 0 1 12 2v7a3 3 0 0 0-3 3z' fill='%238FD3E0'/></svg>">
<link rel="stylesheet" href="shared/theme.css">
<script src="shared/lms.js"></script>
<style>
  body{background:var(--mist);display:grid;place-items:center;min-height:100vh;padding:24px}
  .box{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:36px 32px;text-align:center}
  .box h1{font-size:24px;margin:14px 0 6px;letter-spacing:-.01em}
  .box p{margin:0 0 22px;color:var(--ink-2);font-size:14px}
  #gbtn{display:flex;justify-content:center;min-height:44px}
  .err{display:none;margin-top:16px;padding:10px 12px;border-radius:var(--r);background:var(--coral-soft);color:#8E2A3E;font-size:13px;text-align:left}
  .err.show{display:block}
  .demo{margin-top:24px;padding-top:20px;border-top:1px dashed var(--line);text-align:left}
  .demo b{font-size:13px;color:var(--ink-2)}
  .demo small{display:block;margin:2px 0 10px;color:var(--ink-3);font-size:12px}
  .demo form{display:flex;gap:8px}
  .demo input{flex:1;min-width:0;padding:10px 12px;border:1px solid #C9D6D8;border-radius:var(--r);font:inherit;font-size:14px}
  .demo button{padding:10px 16px;border:0;border-radius:var(--r);background:var(--teal);color:#fff;font-weight:600;font-size:14px}
  .demo button:hover{background:var(--teal-dark)}
  .gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:300px;padding:11px 18px;border:1px solid #C9D6D8;border-radius:999px;background:#fff;color:#1f1f1f;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .gbtn:hover{background:var(--mist)}
  .load{position:fixed;inset:0;background:rgba(255,255,255,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ink-2);font-size:14px;z-index:10}
  .load.show{display:flex}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="box">
  <svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 1 10 10h-7a3 3 0 0 0-3-3z" fill="#F0605D"/><path d="M22 12a10 10 0 0 1-10 10v-7a3 3 0 0 0 3-3z" fill="#2BB3A8"/><path d="M12 22A10 10 0 0 1 2 12h7a3 3 0 0 0 3 3z" fill="#F5B83D"/><path d="M2 12A10 10 0 0 1 12 2v7a3 3 0 0 0-3 3z" fill="#8FD3E0"/></svg>
  <h1 id="title"></h1>
  <p id="lead">Sign in with your First Circle account to start your onboarding.</p>
  <div id="gbtn"></div>
  <div class="err" id="err" role="alert"></div>

  <div class="demo" id="demo" hidden style="margin-top:20px">
    <b id="demoTitle">Continue with your work email</b>
    <small id="demoHint">Use your First Circle email.</small>
    <form id="demoForm"><input id="demoEmail" type="email" placeholder="name@firstcircle.com" required aria-label="Email"><button>Continue</button></form>
  </div>
</main>
<div class="load" id="load" role="status" aria-live="polite"><div class="spin"></div>Signing you in…</div>

<script>
const C = LMS.config, $ = id => document.getElementById(id);
$("title").textContent = C.appName;

function showError(msg){ const e = $("err"); e.textContent = msg; e.classList.add("show"); }
function fail(){ showError("Email unauthorized. Please contact Salesops."); }
// Short "signing in" screen, then the dashboard.
const done = () => { $("load").classList.add("show"); setTimeout(() => { location.href = "dashboard.html"; }, 1000); };

const GOOGLE_G = '<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.500 42.600 14.600 48 24 48z"/></svg>';

// Already signed in? Skip the page.
const saved = LMS.storedUser();
if (saved && LMS.isAllowed(saved.email)) location.replace("dashboard.html");

if (C.demo || C.emailLogin || !C.googleClientId) {
  // Google sign-in isn't connected yet: the button leads to the email step.
  $("gbtn").innerHTML = `<button class="gbtn" id="gfake" type="button">${GOOGLE_G}Sign in with Google</button>`;
  $("gfake").onclick = () => { $("demo").hidden = false; $("demoEmail").focus(); };
  $("demoForm").onsubmit = e => {
    e.preventDefault(); $("err").classList.remove("show");
    try { LMS.signInDemo($("demoEmail").value.trim()); done(); } catch(err){ fail(); }
  };
} else {
  const s = document.createElement("script");
  s.src = "https://accounts.google.com/gsi/client"; s.async = true;
  s.onload = () => {
    google.accounts.id.initialize({
      client_id: C.googleClientId,
      hd: C.allowedDomain,                                   // hint only: Google shows just this domain's accounts
      callback: r => LMS.signInWithGoogle(r.credential).then(done).catch(fail)
    });
    google.accounts.id.renderButton($("gbtn"), { theme:"outline", size:"large", text:"signin_with", shape:"pill" });
  };
  document.head.appendChild(s);
}
</script>
</body>
</html>
