<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exams | AM Onboarding Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2a10 10 0 0 1 10 10h-7a3 3 0 0 0-3-3z' fill='%23F0605D'/><path d='M22 12a10 10 0 0 1-10 10v-7a3 3 0 0 0 3-3z' fill='%232BB3A8'/><path d='M12 22A10 10 0 0 1 2 12h7a3 3 0 0 0 3 3z' fill='%23F5B83D'/><path d='M2 12A10 10 0 0 1 12 2v7a3 3 0 0 0-3 3z' fill='%238FD3E0'/></svg>">
<link rel="stylesheet" href="shared/theme.css">
<script src="shared/lms.js"></script>
<script src="exams/registry.js"></script>
<script src="shared/shell.js"></script>
<style>
  .lead{margin:8px 0 22px;color:var(--ink-2);font-size:15px;max-width:640px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .ex{border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px;background:#fff}
  .ex h3{font-size:16px;line-height:1.3}
  .ex .where{font-size:12px;font-weight:600;color:var(--ink-3)}
  .ex .type{font-size:14px;color:var(--ink-2)}
  .ex .btn{margin-top:auto;align-self:flex-start}
  .ex .wrap2{margin-top:12px}
</style>
</head>
<body>
<div id="strip"></div>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="main"><div class="wrap" id="app"></div></main>
</div>
<script>
if (LMS.requireSignIn()) {
  renderSide("exams");
  if (!LMS.isAdmin()) document.getElementById("app").innerHTML = '<h1>Exams</h1><p class="muted">This page is for trainers.</p>';
  else document.getElementById("app").innerHTML = `<h1>Exams</h1>
    <p class="lead">Try any exam the way a trainee sees it. <b>Nothing you do here is recorded</b>, and no attempt or score is saved or sent to the Sheet. You still see your score at the end.</p>
    <div class="grid">${(window.LMS_EXAM_LIST || []).map(e => `<div class="ex">
      <span class="where">${esc(e.where)}</span><h3>${esc(e.title)}</h3><span class="type">${esc(e.type)}</span>
      <div class="wrap2"><a class="btn primary sm" href="${esc(e.href)}${e.href.includes("?") ? "&" : "?"}preview=1">Preview</a></div></div>`).join("")}</div>`;
}
</script>
</body>
</html>
